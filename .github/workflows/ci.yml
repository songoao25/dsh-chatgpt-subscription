name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动补跑：release-please 的发布分支不会收到 pull_request 事件（推送方是
  # GITHUB_TOKEN），没有这个入口时它永远等不到必需的 CI 检查，发布 PR 无法合并。
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Verify generated bundle is committed
        run: git diff --exit-code -- lib/index.js lib/client.js
      - name: Run tests
        run: node tests/run-all.mjs
