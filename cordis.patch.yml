# dsh-chatgpt-subscription bundle patch: mounts the plugin into a profile layer stack.
# The plugin row id is 'dsh-chatgpt-subscription' — users may override its behavior in
# their profile's cordis.patch.yml with a row carrying the same id.
- insert:
    - id: dsh-chatgpt-subscription
      name: 'dsh-chatgpt-subscription'

# The plugin switches the web-search-deepseek provider's credential reference at runtime:
# ChatGPT mode uses a deliberately absent reference; DeepSeek mode restores
# DEEPSEEK_API_KEY. Keeping the provider mounted makes the switch reversible.
