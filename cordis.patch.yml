# dsh-chatgpt-subscription bundle patch: mounts the plugin into a profile layer stack.
# The row id is the key users override in their profile's cordis.patch.yml; the row name
# is the module this package exports, so it must stay the package name.
# Keep the two different: DSH's plugin card prints the row id and the module name on
# separate lines (skipping one only when it equals the row title), so an id equal to the
# module name renders the same string twice. Official bundles do the same, e.g.
# 'agent-team' + '@deepseek-ai/dsh-experimental-agent-team'.
- insert:
    - id: chatgpt-subscription
      name: 'dsh-chatgpt-subscription'

# This plugin owns only ChatGPT subscription OAuth binding, token upkeep, and the
# openai-codex model route. It does NOT manage web search: the search provider
# (searchProvider, e.g. deepseek-official / exa) is configured by the user in their
# own profile layer, and this plugin never reads, rewrites, or switches search settings.
